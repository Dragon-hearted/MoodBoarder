# systems/MoodBoarder/knowledge/usage.yaml
# Canonical usage source for the ReadmeEngine (Appendix A schema).
# MoodBoarder: per-client Pinterest moodboard generator.
# Reference (image OR video) → Claude vision visual-DNA → Pinterest search
# keywords → hi-res image/video scrape → timestamped per-deliverable folder.

features:
  - name: "Image reference analysis (Claude vision)"
    description: "Reads a reference image via the local `claude` CLI and extracts a structured visual DNA — subject, mood, lighting, composition, 5-hex color palette, 3 dominant colors, style, era/genre, texture."
  - name: "Video reference analysis"
    description: "ffmpeg extracts N evenly-spaced keyframes (intro/outro 5% trimmed), each analyzed by Claude vision, then merged into one visual DNA by frequency/mode voting across frames."
  - name: "Pinterest search-keyword synthesis"
    description: "Claude turns the merged visual DNA (plus an optional text nudge) into N ready-to-search Pinterest phrases. Count configurable via --keywords (default 5)."
  - name: "Optional text-description nudge"
    description: "--description weights specific language into keyword synthesis while staying anchored to the extracted visual DNA."
  - name: "Hi-res Pinterest image scraping"
    description: "Playwright drives a logged-in Pinterest session, scroll-harvests pins per keyword, dedupes by pin hash keeping the largest variant, and upgrades thumbnails to /originals/ (falling back to /736x/)."
  - name: "Pinterest video scraping"
    description: "Harvests v.pinimg.com / .mp4 sources alongside images; deduped by video hash and downloaded with a video/* content-type guard."
  - name: "Concurrent download with quality guards"
    description: "Pooled downloads (8 image / 3 video workers) enforce content-type prefix and minimum byte size (8KB images, 32KB videos), skipping junk avatars/thumbnails."
  - name: "Timestamped per-client / per-deliverable assembly"
    description: "Outputs to client/<client>/<deliverable>/moodboard/moodboard_<YYYY-MM-DD_HH-MM-SS>/ with images/, videos/, and analysis/ subfolders; empty media subdirs are pruned."
  - name: "Analysis artifacts"
    description: "Writes visual_dna.json and search_keywords.json into analysis/ early, so the moodboard is preserved even if the scrape stage fails."
  - name: "Media mode + count controls"
    description: "--media images|videos|both with --image-count/--video-count, or --count sugar (splits 70/30 image:video under 'both')."
  - name: "Session reuse + headed-login fallback"
    description: "Reuses saved Pinterest cookies (cookies.json) headlessly; falls back to an interactive headed browser login when cookies are missing or stale. --headless opts into headless after first login."
  - name: "Fixture-replay (CI) mode"
    description: "MOODBOARDER_REPLAY_FIXTURES=1 reads visual DNA + keywords from fixtures and skips the live scrape — deterministic, runnable without a Claude login or Pinterest session."

prerequisites:
  - "Bun v1.0+ — curl -fsSL https://bun.sh/install | bash"
  - "Claude Code CLI (`claude`) logged in — powers vision analysis + keyword synthesis. No API key; it reuses your local `claude` session."
  - "Playwright Chromium — bunx playwright install chromium"
  - "ffmpeg + ffprobe (only for --video input) — brew install ffmpeg"
  - "A Pinterest account — first run opens a headed browser for manual login; cookies are cached to cookies.json thereafter."
  - "Must run from inside the Adcelerate monorepo — output path resolves against the systems.yaml root marker."

configVars:
  - name: "MOODBOARDER_REPLAY_FIXTURES"
    required: false
    description: "Set to 1 to read visual DNA + keywords from fixtures and skip the live Pinterest scrape (CI / offline / dry-run)."
  - name: "MOODBOARDER_FIXTURE_DIR"
    required: false
    description: "Directory holding visual_dna.json + search_keywords.json fixtures used when MOODBOARDER_REPLAY_FIXTURES=1 (e.g. tests/fixtures)."

install:
  - "cd systems/MoodBoarder"
  - "bun install"
  - "bunx playwright install chromium    # one-time"
  - "brew install ffmpeg                  # only needed for --video input"

usageSteps:
  - title: "Show all commands and flags"
    command: "bun run src/cli.ts --help"
    expected: "Prints usage, the full flag list (--client, --deliverable, --image/--video, --media, --count, etc.), and examples. Verified."
  - title: "Validate arguments fail-fast"
    command: "bun run src/cli.ts --client acme"
    expected: "Exits non-zero with 'error: --deliverable is required'. Verified — required-arg and mutually-exclusive --image/--video / --count conflict guards all fire."
  - title: "Dry-run end-to-end (fixture replay, no credentials)"
    command: "MOODBOARDER_REPLAY_FIXTURES=1 MOODBOARDER_FIXTURE_DIR=tests/fixtures bun run src/cli.ts --client acme --deliverable spring-launch --image tests/fixtures/sample.png --media images"
    expected: "Verified — runs all 3 stages from fixtures, skips the live scrape, and writes client/acme/spring-launch/moodboard/moodboard_<timestamp>/analysis/{visual_dna.json,search_keywords.json}."
  - title: "Generate an image moodboard from a reference image"
    command: "bun run src/cli.ts --client acme --deliverable spring-launch --image ref.jpg"
    expected: "requires logged-in `claude` CLI session + Pinterest login — not executed. Analyzes ref.jpg, synthesizes 5 keywords, scrapes Pinterest, and saves up to 40 images + 10 videos under client/acme/spring-launch/moodboard/moodboard_<timestamp>/."
  - title: "Images only with a custom target count"
    command: "bun run src/cli.ts --client acme --deliverable spring-launch --image ref.jpg --media images --image-count 60"
    expected: "requires logged-in `claude` CLI session + Pinterest login — not executed. Saves up to 60 images and no videos."
  - title: "Video reference with a total count and description nudge"
    command: "bun run src/cli.ts --client acme --deliverable spring-launch --video ref.mp4 --count 30 --description \"soft natural light\""
    expected: "requires logged-in `claude` CLI session + Pinterest login + ffmpeg — not executed. Extracts 5 keyframes, analyzes each, merges DNA, and saves 30 assets split 70/30 (≈21 images + 9 videos)."
  - title: "Headless scrape after first login"
    command: "bun run src/cli.ts --client acme --deliverable spring-launch --image ref.jpg --headless"
    expected: "requires cached Pinterest cookies (cookies.json) from a prior headed login — not executed. Runs Chromium headless using saved cookies; falls back to headed login if cookies are stale."

commandsReference:
  - command: "bun run src/cli.ts --help"
    description: "List all commands and flags."
  - command: "just scrape <args>"
    description: "Proxy to the CLI (e.g. just scrape --client acme --deliverable d --image ref.jpg)."
  - command: "just install-chromium"
    description: "Install the Playwright Chromium browser (one-time)."
  - command: "bun test"
    description: "Run the test suite (52 tests; fixture-replay paths require no credentials). Verified passing."
  - command: "bun run lint"
    description: "Biome lint check (tab indent, 100-col width)."
  - command: "bun run check"
    description: "Biome check + auto-fix formatting."
  - command: "bun run build"
    description: "Bundle src/index.ts to dist/ (Playwright/Chromium externalized)."
  - command: "just diagnose moodboarder"
    description: "Run Adcelerate Diagnose Mode against this system."
